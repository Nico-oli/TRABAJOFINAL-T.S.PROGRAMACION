# JWT
# Secreto usado para firmar los tokens (HS256, clave Base64 de 512 bits).
# IMPORTANTE: en producción este valor debe venir de una variable de entorno,
# nunca debe quedar committeado en el repositorio.
jwt.secret=${JWT_SECRET:k2Z+AWSpFWmdqFn3usBOy4zlvdpASuLxfugLEMf/5t6BmvEQtF8eqrwylriYcLfK0eNnDM0WoTyfQrZR/0k3TA==}
# Expiración del token en milisegundos (24 horas)
jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}

# Usuario Administrador creado automáticamente al primer arranque
# (solo si la tabla de usuarios está vacía).
app.admin.default-email=${ADMIN_EMAIL:admin@institucion.edu.ar}
app.admin.default-password=${ADMIN_PASSWORD:Admin123!}


# Faltas / Baja lógica automática de alumnos
# Cantidad de faltas a partir de la cual un alumno se da de baja lógicamente
# (activo = false) en forma automática.
app.alumno.limite-faltas=${ALUMNO_LIMITE_FALTAS:15}

# Cantidad mínima de faltas a partir de la cual se considera que el alumno
# está "próximo" al límite, para poder avisar antes de que se llegue a la
# baja lógica. Debe ser menor que app.alumno.limite-faltas.
app.alumno.faltas-aviso=${ALUMNO_FALTAS_AVISO:12}

app.alumno.limite-faltas-adicionales=${ALUMNO_LIMITE_FALTAS_ADICIONALES:20}
app.alumno.adicionales-aviso=${ALUMNO_ADICIONALES_AVISO:17}

server.port=8081