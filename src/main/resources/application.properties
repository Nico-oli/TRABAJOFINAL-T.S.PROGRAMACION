spring.application.name=TrabajoFinal

# ---------------------------------------------------------------------------
# Base de datos (H2 en memoria para desarrollo). Para producción, comentar
# este bloque y descomentar/configurar el bloque de PostgreSQL de abajo.
# ---------------------------------------------------------------------------
spring.datasource.url=jdbc:h2:mem:asistencias_db;DB_CLOSE_DELAY=-1
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true

spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# ---------------------------------------------------------------------------
# PostgreSQL (para producción). Descomentar y completar con las credenciales
# reales, y borrar/comentar el bloque de H2 de arriba.
# ---------------------------------------------------------------------------
# spring.datasource.url=jdbc:postgresql://localhost:5432/asistencias_db
# spring.datasource.driverClassName=org.postgresql.Driver
# spring.datasource.username=postgres
# spring.datasource.password=postgres
# spring.jpa.hibernate.ddl-auto=update
# spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# ---------------------------------------------------------------------------
# JWT
# ---------------------------------------------------------------------------
# Secreto usado para firmar los tokens (HS256, clave Base64 de 512 bits).
# IMPORTANTE: en producción este valor debe venir de una variable de entorno,
# nunca debe quedar committeado en el repositorio.
jwt.secret=${JWT_SECRET:k2Z+AWSpFWmdqFn3usBOy4zlvdpASuLxfugLEMf/5t6BmvEQtF8eqrwylriYcLfK0eNnDM0WoTyfQrZR/0k3TA==}
# Expiración del token en milisegundos (24 horas)
jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}

# ---------------------------------------------------------------------------
# Usuario Administrador creado automáticamente al primer arranque
# (solo si la tabla de usuarios está vacía).
# ---------------------------------------------------------------------------
app.admin.default-email=${ADMIN_EMAIL:admin@institucion.edu.ar}
app.admin.default-password=${ADMIN_PASSWORD:Admin123!}

# ---------------------------------------------------------------------------
# CORS
# ---------------------------------------------------------------------------
# Orígenes permitidos separados por coma. En producción, configurar la
# variable de entorno CORS_ALLOWED_ORIGINS con el/los dominio(s) reales del
# frontend. No usar "*" acá: la API permite requests con credenciales
# (allowCredentials=true), y combinarlo con un origen comodín es inseguro.
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:5173}
