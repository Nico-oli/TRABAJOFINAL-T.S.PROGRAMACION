<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>Curso · Asistencia</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="stylesheet" href="../css/variables.css">
<link rel="stylesheet" href="../css/base.css">
<link rel="stylesheet" href="../css/components.css">
</head>
<body>

<div class="app-shell">
  <div class="app-content">
    <div class="app-deco-layer" aria-hidden="true">
      <svg width="0" height="0" style="position:absolute">
        <defs>
          <path id="curso-deco-scribble" d="M20,120 C15,70 55,20 110,25 C165,30 188,75 150,108 C118,136 78,118 90,86 C98,64 128,60 130,82" />
        </defs>
      </svg>
      <svg class="app-deco app-deco-tr" viewBox="0 0 220 220" focusable="false">
        <use href="#curso-deco-scribble" />
      </svg>
      <svg class="app-deco app-deco-bl" viewBox="0 0 220 220" focusable="false">
        <use href="#curso-deco-scribble" />
      </svg>
    </div>

    <header class="app-header">
      <div class="app-header-brand">
        <div class="kicker">Asistencia</div>
        <h2 id="app-header-title"></h2>
      </div>
      <span id="app-header-role" class="tag"></span>
      <nav class="tab-bar" id="tab-bar"></nav>
    </header>
    <main class="app-main app-main-wide app-main-curso">
      <button class="btn btn-ghost btn-back" id="back-to-courses-btn">
        <img src="../assets/icons/chevron-left.svg" alt=""> Cursos
      </button>

      <p id="course-error" class="text-muted" style="color:var(--color-accent-800)" hidden></p>

      <div class="card" id="course-card" style="margin:var(--space-3) 0 var(--space-4)"></div>

      <div style="display:flex;gap:var(--space-2);margin-bottom:var(--space-4)">
        <button class="btn btn-secondary" id="edit-course-open-btn">Editar curso</button>
        <button class="btn btn-secondary" id="baja-course-open-btn">Dar de baja</button>
      </div>

      <div style="display:flex;align-items:center;justify-content:space-between;gap:var(--space-3)">
        <div class="section-label">Alumnos del curso</div>
        <button class="btn btn-primary" id="new-student-open-btn">+ Añadir alumno</button>
      </div>
      <div id="course-roster"></div>
    </main>
  </div>
</div>

<div class="dialog-backdrop" id="student-form-backdrop" hidden>
  <div class="dialog">
    <div class="dialog-title">Nuevo alumno</div>
    <p id="student-form-error" class="text-muted" style="color:var(--color-accent-800);font-size:13px" hidden></p>
    <div class="field">
      <label for="student-form-nombre">Nombre</label>
      <input class="input" id="student-form-nombre">
    </div>
    <div class="field">
      <label for="student-form-apellido">Apellido</label>
      <input class="input" id="student-form-apellido">
    </div>
    <div class="field">
      <label for="student-form-dni">DNI</label>
      <input class="input" id="student-form-dni" type="number" min="1">
    </div>
    <div class="field">
      <label for="student-form-nacimiento">Fecha de nacimiento</label>
      <input class="input" id="student-form-nacimiento" type="date">
    </div>
    <div class="field">
      <label for="student-form-curso">Curso</label>
      <select class="input" id="student-form-curso"></select>
    </div>
    <div class="dialog-actions">
      <button class="btn btn-secondary" id="student-form-cancel-btn">Cancelar</button>
      <button class="btn btn-primary" id="student-form-confirm-btn">Crear</button>
    </div>
  </div>
</div>

<div class="dialog-backdrop" id="edit-course-backdrop" hidden>
  <div class="dialog">
    <div class="dialog-title">Editar curso</div>
    <p id="edit-course-error" class="text-muted" style="color:var(--color-accent-800);font-size:13px" hidden></p>
    <div class="field">
      <label for="edit-course-nombre">Nombre</label>
      <input class="input" id="edit-course-nombre">
    </div>
    <div class="field">
      <label for="edit-course-anio">Año lectivo</label>
      <input class="input" id="edit-course-anio" type="number" min="1" max="7">
    </div>
    <div class="field">
      <label for="edit-course-turno">Turno</label>
      <input class="input" id="edit-course-turno" placeholder="Mañana, Tarde...">
    </div>
    <div class="field">
      <label>Preceptores asignados</label>
      <div id="edit-course-asistentes" style="max-height:260px;overflow-y:auto"></div>
    </div>
    <div class="dialog-actions">
      <button class="btn btn-secondary" id="edit-course-cancel-btn">Cancelar</button>
      <button class="btn btn-primary" id="edit-course-confirm-btn">Guardar</button>
    </div>
  </div>
</div>

<div class="dialog-backdrop" id="confirm-baja-backdrop" hidden>
  <div class="dialog">
    <div class="dialog-title" id="confirm-baja-title">Dar de baja</div>
    <div class="dialog-body" id="confirm-baja-message"></div>
    <p id="confirm-baja-error" class="text-muted" style="color:var(--color-accent-800);font-size:13px" hidden></p>
    <div class="dialog-actions">
      <button class="btn btn-secondary" id="confirm-baja-cancel-btn">Cancelar</button>
      <button class="btn btn-primary" id="confirm-baja-confirm-btn">Confirmar</button>
    </div>
  </div>
</div>

<div class="toast" id="toast" hidden></div>

<script type="module" src="../js/pages/admin-curso.js"></script>
</body>
</html>
