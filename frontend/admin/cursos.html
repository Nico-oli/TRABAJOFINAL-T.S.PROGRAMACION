<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>Cursos · Asistencia</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="stylesheet" href="../css/variables.css">
<link rel="stylesheet" href="../css/base.css">
<link rel="stylesheet" href="../css/components.css">
</head>
<body>

<div class="app-shell">
  <div class="app-content">
    <div class="app-deco-layer" aria-hidden="true">
      <svg width="0" height="0" style="position:absolute">
        <defs>
          <path id="cursos-deco-scribble" d="M170,20 C210,40 205,90 165,100 C125,110 96,82 118,55 C134,35 168,42 162,66 C158,82 138,84 130,68 C124,55 138,48 145,58" />
        </defs>
      </svg>
      <svg class="app-deco app-deco-tr" viewBox="0 0 220 220" focusable="false">
        <use href="#cursos-deco-scribble" />
      </svg>
      <svg class="app-deco app-deco-bl" viewBox="0 0 220 220" focusable="false">
        <use href="#cursos-deco-scribble" />
      </svg>
    </div>

    <header class="app-header">
      <div class="app-header-brand">
        <div class="kicker">Asistencia</div>
        <h2 id="app-header-title"></h2>
      </div>
      <span id="app-header-role" class="tag"></span>
      <nav class="tab-bar" id="tab-bar"></nav>
    </header>
    <main class="app-main app-main-wide app-main-cursos">
      <button class="btn btn-primary btn-block" id="new-course-open-btn" style="margin-bottom:var(--space-3)">+ Nuevo curso</button>
      <p id="course-list-error" class="text-muted" style="color:var(--color-accent-800)" hidden></p>
      <div id="course-list" class="card-grid"></div>
    </main>
  </div>
</div>

<div class="dialog-backdrop" id="course-form-backdrop" hidden>
  <div class="dialog">
    <div class="dialog-title">Nuevo curso</div>
    <p id="course-form-error" class="text-muted" style="color:var(--color-accent-800);font-size:13px" hidden></p>
    <div class="field">
      <label for="course-form-nombre">Nombre</label>
      <input class="input" id="course-form-nombre" placeholder="Ej: Programacion">
    </div>
    <div class="field">
      <label for="course-form-anio">Año lectivo</label>
      <input class="input" id="course-form-anio" type="number" min="1" max="7">
    </div>
    <div class="field">
      <label for="course-form-turno">Turno</label>
      <input class="input" id="course-form-turno" placeholder="Mañana, Tarde...">
    </div>
    <div class="dialog-actions">
      <button class="btn btn-secondary" id="course-form-cancel-btn">Cancelar</button>
      <button class="btn btn-primary" id="course-form-confirm-btn">Crear</button>
    </div>
  </div>
</div>

<div class="toast" id="toast" hidden></div>

<script type="module" src="../js/pages/admin-cursos.js"></script>
</body>
</html>
