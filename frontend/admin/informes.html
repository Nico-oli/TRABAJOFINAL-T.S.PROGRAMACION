<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>Informes · Asistencia</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="stylesheet" href="../css/variables.css">
<link rel="stylesheet" href="../css/base.css">
<link rel="stylesheet" href="../css/components.css">
</head>
<body>

<div class="app-shell">
  <div class="app-content">
    <!-- Decoración de fondo, sólo desktop (mismo criterio que .auth-deco
         del login: trazo único estilo garabato, opacity baja, sin
         interferir con el contenido) — capa fixed de viewport porque acá
         no hay un .auth-card centrado, sino el layout de app normal. -->
    <div class="app-deco-layer" aria-hidden="true">
      <svg width="0" height="0" style="position:absolute">
        <defs>
          <path id="informes-deco-scribble" d="M14,150 C10,84 56,26 128,22 C192,18 224,64 190,98 C154,134 96,110 108,68 C116,40 156,40 160,66 C162,84 144,96 130,86" />
        </defs>
      </svg>
      <svg class="app-deco app-deco-tr" viewBox="0 0 220 220" focusable="false">
        <use href="#informes-deco-scribble" />
      </svg>
      <svg class="app-deco app-deco-bl" viewBox="0 0 220 220" focusable="false">
        <use href="#informes-deco-scribble" />
      </svg>
    </div>

    <header class="app-header">
      <div class="app-header-brand">
        <div class="kicker">Asistencia</div>
        <h2 id="app-header-title"></h2>
      </div>
      <span id="app-header-role" class="tag"></span>
      <nav class="tab-bar" id="tab-bar"></nav>
    </header>
    <main class="app-main app-main-wide app-main-informes">
      <p id="report-error" class="text-muted" style="color:var(--color-accent-800)" hidden></p>

      <div class="field" style="margin-bottom:var(--space-4)">
        <label for="report-course-select">Curso</label>
        <select class="input" id="report-course-select"></select>
      </div>

      <div id="report-stats" class="stat-grid" style="margin-bottom:var(--space-5)"></div>

      <div class="section-label">Asistencia por alumno</div>
      <div id="report-rows"></div>
    </main>
  </div>
</div>

<script type="module" src="../js/pages/admin-informes.js"></script>
</body>
</html>
