<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>Inicio · Asistencia</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="stylesheet" href="../css/variables.css">
<link rel="stylesheet" href="../css/base.css">
<link rel="stylesheet" href="../css/components.css">
</head>
<body>

<div class="app-shell">
  <div class="app-content">
    <div class="app-deco-layer" aria-hidden="true">
      <svg width="0" height="0" style="position:absolute">
        <defs>
          <path id="inicio-deco-scribble" d="M18,40 C60,30 70,80 40,110 C10,140 55,172 100,150 C150,126 138,72 180,60 C205,53 212,90 195,112 C182,128 160,120 165,102" />
        </defs>
      </svg>
      <svg class="app-deco app-deco-tr" viewBox="0 0 220 220" focusable="false">
        <use href="#inicio-deco-scribble" />
      </svg>
      <svg class="app-deco app-deco-bl" viewBox="0 0 220 220" focusable="false">
        <use href="#inicio-deco-scribble" />
      </svg>
    </div>

    <header class="app-header">
      <div class="app-header-brand">
        <div class="kicker">Asistencia</div>
        <h2 id="app-header-title"></h2>
      </div>
      <span id="app-header-role" class="tag"></span>
      <nav class="tab-bar" id="tab-bar"></nav>
    </header>
    <main class="app-main app-main-wide app-main-inicio">
      <p id="home-error" class="text-muted" style="color:var(--color-accent-800)" hidden></p>

      <div id="home-stats" class="stat-grid" style="margin-bottom:var(--space-5)"></div>

      <section id="home-alerts-section" hidden>
        <div class="section-label" style="color:var(--color-accent-700)">
          Alertas de inasistencia <span id="home-alerts-count"></span>
        </div>
        <div id="home-alerts-list"></div>
      </section>
    </main>
  </div>
</div>

<script type="module" src="../js/pages/admin-inicio.js"></script>
</body>
</html>
