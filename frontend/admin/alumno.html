<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>Alumno · Asistencia</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="stylesheet" href="../css/variables.css">
<link rel="stylesheet" href="../css/base.css">
<link rel="stylesheet" href="../css/components.css">
</head>
<body>

<div class="app-shell">
  <div class="app-content">
    <div class="app-deco-layer" aria-hidden="true">
      <svg width="0" height="0" style="position:absolute">
        <defs>
          <path id="alumno-deco-scribble" d="M15,150 C15,110 50,110 55,150 C60,190 100,190 100,145 C100,105 140,100 150,140 C158,172 195,165 195,120" />
        </defs>
      </svg>
      <svg class="app-deco app-deco-tr" viewBox="0 0 220 220" focusable="false">
        <use href="#alumno-deco-scribble" />
      </svg>
      <svg class="app-deco app-deco-bl" viewBox="0 0 220 220" focusable="false">
        <use href="#alumno-deco-scribble" />
      </svg>
    </div>

    <header class="app-header">
      <div class="app-header-brand">
        <div class="kicker">Asistencia</div>
        <h2 id="app-header-title"></h2>
      </div>
      <span id="app-header-role" class="tag"></span>
      <nav class="tab-bar" id="tab-bar"></nav>
    </header>
    <main class="app-main app-main-wide app-main-alumno">
      <button class="btn btn-ghost btn-back" id="back-to-students-btn">
        <img src="../assets/icons/chevron-left.svg" alt=""> Alumnos
      </button>

      <p id="student-error" class="text-muted" style="color:var(--color-accent-800)" hidden></p>

      <div class="card" id="student-card" style="margin:var(--space-3) 0 var(--space-4)"></div>

      <button class="btn btn-primary btn-block" id="justify-open-btn" style="margin-bottom:var(--space-2)">Justificar falta</button>
      <button class="btn btn-secondary btn-block" id="edit-student-open-btn" style="margin-bottom:var(--space-2)">Editar alumno</button>
      <button class="btn btn-secondary btn-block" id="reincorporate-open-btn" style="margin-bottom:var(--space-2)" hidden>Reincorporar</button>
      <button class="btn btn-secondary btn-block" id="baja-student-open-btn" style="margin-bottom:var(--space-5)">Dar de baja</button>

      <div class="section-label">Historial reciente</div>
      <div id="student-history"></div>
    </main>
  </div>
</div>

<div class="dialog-backdrop" id="justify-backdrop" hidden>
  <div class="dialog">
    <div class="dialog-title">Justificar falta</div>
    <div class="dialog-body" id="justify-name"></div>
    <div class="field"><label for="justify-date">Fecha</label><input class="input" id="justify-date"></div>
    <div class="field"><label for="justify-reason">Motivo</label><textarea class="input" id="justify-reason" placeholder="Certificado médico, trámite, etc."></textarea></div>
    <div class="dialog-actions">
      <button class="btn btn-secondary" id="justify-cancel-btn">Cancelar</button>
      <button class="btn btn-primary" id="justify-confirm-btn">Confirmar</button>
    </div>
  </div>
</div>

<div class="dialog-backdrop" id="edit-student-backdrop" hidden>
  <div class="dialog">
    <div class="dialog-title">Editar alumno</div>
    <p id="edit-student-error" class="text-muted" style="color:var(--color-accent-800);font-size:13px" hidden></p>
    <div class="field">
      <label for="edit-student-nombre">Nombre</label>
      <input class="input" id="edit-student-nombre">
    </div>
    <div class="field">
      <label for="edit-student-apellido">Apellido</label>
      <input class="input" id="edit-student-apellido">
    </div>
    <div class="field">
      <label for="edit-student-curso">Curso</label>
      <select class="input" id="edit-student-curso"></select>
    </div>
    <div class="field">
      <label for="edit-student-faltas">Faltas</label>
      <input class="input" id="edit-student-faltas" type="number" min="0" max="15">
    </div>
    <div class="dialog-actions">
      <button class="btn btn-secondary" id="edit-student-cancel-btn">Cancelar</button>
      <button class="btn btn-primary" id="edit-student-confirm-btn">Guardar</button>
    </div>
  </div>
</div>

<div class="dialog-backdrop" id="reincorporate-backdrop" hidden>
  <div class="dialog">
    <div class="dialog-title">Reincorporar</div>
    <p id="reincorporate-error" class="text-muted" style="color:var(--color-accent-800);font-size:13px" hidden></p>
    <div class="field">
      <label>Cantidad de faltas adicionales a otorgar</label>
      <div style="display:flex;gap:var(--space-2)">
        <button type="button" class="btn btn-secondary" id="reincorporate-cantidad-5" data-cantidad="5" style="flex:1">5</button>
        <button type="button" class="btn btn-secondary" id="reincorporate-cantidad-10" data-cantidad="10" style="flex:1">10</button>
        <button type="button" class="btn btn-secondary" id="reincorporate-cantidad-15" data-cantidad="15" style="flex:1">15</button>
      </div>
    </div>
    <div class="dialog-actions">
      <button class="btn btn-secondary" id="reincorporate-cancel-btn">Cancelar</button>
      <button class="btn btn-primary" id="reincorporate-confirm-btn" disabled>Confirmar</button>
    </div>
  </div>
</div>

<div class="dialog-backdrop" id="confirm-baja-backdrop" hidden>
  <div class="dialog">
    <div class="dialog-title" id="confirm-baja-title">Dar de baja</div>
    <div class="dialog-body" id="confirm-baja-message"></div>
    <p id="confirm-baja-error" class="text-muted" style="color:var(--color-accent-800);font-size:13px" hidden></p>
    <div class="dialog-actions">
      <button class="btn btn-secondary" id="confirm-baja-cancel-btn">Cancelar</button>
      <button class="btn btn-primary" id="confirm-baja-confirm-btn">Confirmar</button>
    </div>
  </div>
</div>

<div class="toast" id="toast" hidden></div>

<script type="module" src="../js/pages/admin-alumno.js"></script>
</body>
</html>
