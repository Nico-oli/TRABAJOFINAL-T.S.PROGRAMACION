<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>Alumnos · Asistencia</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="stylesheet" href="../css/variables.css">
<link rel="stylesheet" href="../css/base.css">
<link rel="stylesheet" href="../css/components.css">
</head>
<body>

<div class="app-shell">
  <div class="app-content">
    <div class="app-deco-layer" aria-hidden="true">
      <svg width="0" height="0" style="position:absolute">
        <defs>
          <path id="alumnos-deco-scribble" d="M10,60 C50,20 90,20 100,55 C110,90 150,60 145,25 C142,5 175,0 190,25 C200,42 185,60 170,50 C160,43 165,30 175,32" />
        </defs>
      </svg>
      <svg class="app-deco app-deco-tr" viewBox="0 0 220 220" focusable="false">
        <use href="#alumnos-deco-scribble" />
      </svg>
      <svg class="app-deco app-deco-bl" viewBox="0 0 220 220" focusable="false">
        <use href="#alumnos-deco-scribble" />
      </svg>
    </div>

    <header class="app-header">
      <div class="app-header-brand">
        <div class="kicker">Asistencia</div>
        <h2 id="app-header-title"></h2>
      </div>
      <span id="app-header-role" class="tag"></span>
      <nav class="tab-bar" id="tab-bar"></nav>
    </header>
    <main class="app-main app-main-wide app-main-alumnos">
      <input class="input" id="student-search" placeholder="Buscar alumno..." style="margin-bottom:10px">
      <div style="display:flex;gap:var(--space-2);margin-bottom:var(--space-3)">
        <button class="btn btn-primary" id="new-student-open-btn" style="flex:1">+ Nuevo alumno</button>
        <button class="btn btn-secondary" id="select-mode-toggle-btn">Seleccionar</button>
      </div>
      <p id="student-list-error" class="text-muted" style="color:var(--color-accent-800)" hidden></p>
      <div id="student-list" style="padding-bottom:70px"></div>
    </main>
  </div>
</div>

<div class="bulk-bar" id="bulk-bar" hidden>
  <span class="bulk-bar-count" id="bulk-bar-count"></span>
  <select class="input" id="bulk-bar-curso"></select>
  <button class="btn btn-primary" id="bulk-bar-move-btn" disabled>Mover al siguiente curso</button>
  <button class="btn btn-ghost" id="bulk-bar-cancel-btn">Cancelar</button>
</div>

<div class="dialog-backdrop" id="move-confirm-backdrop" hidden>
  <div class="dialog">
    <div class="dialog-title">Confirmar movimiento</div>
    <div class="dialog-body" id="move-confirm-body"></div>
    <div class="dialog-actions">
      <button class="btn btn-secondary" id="move-confirm-cancel-btn">Cancelar</button>
      <button class="btn btn-primary" id="move-confirm-ok-btn">Confirmar</button>
    </div>
  </div>
</div>

<div class="dialog-backdrop" id="move-result-backdrop" hidden>
  <div class="dialog">
    <div class="dialog-title">Resultado</div>
    <div class="dialog-body" id="move-result-body"></div>
    <div class="dialog-actions">
      <button class="btn btn-primary" id="move-result-close-btn">Cerrar</button>
    </div>
  </div>
</div>

<div class="dialog-backdrop" id="student-form-backdrop" hidden>
  <div class="dialog">
    <div class="dialog-title">Nuevo alumno</div>
    <p id="student-form-error" class="text-muted" style="color:var(--color-accent-800);font-size:13px" hidden></p>
    <div class="field">
      <label for="student-form-nombre">Nombre</label>
      <input class="input" id="student-form-nombre">
    </div>
    <div class="field">
      <label for="student-form-apellido">Apellido</label>
      <input class="input" id="student-form-apellido">
    </div>
    <div class="field">
      <label for="student-form-dni">DNI</label>
      <input class="input" id="student-form-dni" type="number" min="1">
    </div>
    <div class="field">
      <label for="student-form-nacimiento">Fecha de nacimiento</label>
      <input class="input" id="student-form-nacimiento" type="date">
    </div>
    <div class="field">
      <label for="student-form-curso">Curso</label>
      <select class="input" id="student-form-curso"></select>
    </div>
    <div class="dialog-actions">
      <button class="btn btn-secondary" id="student-form-cancel-btn">Cancelar</button>
      <button class="btn btn-primary" id="student-form-confirm-btn">Crear</button>
    </div>
  </div>
</div>

<div class="toast" id="toast" hidden></div>

<script type="module" src="../js/pages/admin-alumnos.js"></script>
</body>
</html>
