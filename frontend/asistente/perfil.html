<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>Perfil · Asistencia</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="stylesheet" href="../css/variables.css">
<link rel="stylesheet" href="../css/base.css">
<link rel="stylesheet" href="../css/components.css">
</head>
<body>

<div class="app-shell">
  <div class="app-content">
    <header class="app-header">
      <div class="app-header-brand">
        <div class="kicker">Asistencia</div>
        <h2 id="app-header-title"></h2>
      </div>
      <span id="app-header-role" class="tag"></span>
      <nav class="tab-bar" id="tab-bar"></nav>
    </header>
    <main class="app-main">
      <div class="card" style="margin-bottom:var(--space-4)">
        <div class="card-title" id="profile-name"></div>
        <div class="card-body">Asistente · Instituto San Martín</div>
      </div>

      <div class="section-label">Cursos asignados</div>
      <div id="profile-courses" style="margin-bottom:var(--space-6)"></div>

      <button class="btn btn-secondary btn-block" id="switch-role-btn">Cambiar a Administrador (demo)</button>
      <button class="btn btn-ghost" id="logout-btn" style="margin-top:6px">Cerrar sesión</button>
    </main>
  </div>
</div>

<script type="module" src="../js/pages/asistente-perfil.js"></script>
</body>
</html>
